[package]
name = "dragowalker"
version = "0.2.1"
edition = "2021"
description = "DragoWalker - éditeur de cartes GTA V (ymap / ytyp / MLO) avec assistant IA"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
rfd = "0.15"
ureq = { version = "2.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png"] }
aes = "0.8"
sha1 = "0.10"
flate2 = "1"
rayon = "1"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
