[package]
name = "dragowalker"
version = "0.2.5"
edition = "2021"
description = "DragoWalker - Ã©diteur de cartes GTA V (ymap / ytyp / MLO) avec assistant IA"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
roxmltree = "0.20"
rfd = "0.15"
ureq = { version = "2.12", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png"] }
aes = "0.8"
sha1 = "0.10"
sha2 = "0.10"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
flate2 = "1"
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
